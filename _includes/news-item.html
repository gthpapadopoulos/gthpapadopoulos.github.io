{% assign n = include.n %}
<li class="news-item" data-type="{{ n.type }}">
  <time datetime="{{ n.date | date_to_xmlschema }}">{{ n.date | date: "%b %-d, %Y" }}</time>
  <span class="tag tag-{{ n.type }}">{{ site.news_types[n.type].label | default: "News" }}</span>
  <a href="{{ n.url | relative_url }}">{{ n.title }}</a>
</li>
