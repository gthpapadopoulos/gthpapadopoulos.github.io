  cv: ""           # TODO: e.g. /assets/pdf/cv.pdf (shows a CV button when set)

# Google Form of the "Collaborate with me" section (Contact page).
# Paste the form link (…/viewform) here; leave "" to show an e-mail button instead.
collaboration_form: ""

# Name variants highlighted in author lists
me_names:
  - "G. Th. Papadopoulos"
  - "G. Th Papadopoulos"

# Main menu (order shown in the header)
nav:
  - { title: Home,         url: / }
  - { title: Publications, url: /publications/ }
  - { title: Projects,     url: /projects/ }
  - { title: Group,        url: /group/ }
  - { title: Teaching,     url: /teaching/ }
  - { title: News,         url: /news/ }
  - { title: Contact,      url: /contact/ }

# News item types: label shown on the tag
news_types:
  paper:   { label: Paper,   plural: Papers }
  talk:    { label: Talk,    plural: Talks }
  project: { label: Project, plural: Projects }
  event:   { label: Event,   plural: Events }
  visit:   { label: Visit,   plural: Visits }
  vacancy: { label: Vacancy, plural: Vacancies }
  news:    { label: News,    plural: Other news }

# ---------------------------------------------------------------
# Build settings (no need to change)
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
timezone: Europe/Athens
permalink: /:title/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
feed:
  path: news/feed.xml
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page, image: /assets/img/share-card.png }   # image = default link preview (posts use their own cover)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
